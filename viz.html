<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Dorina — Nöral Görselleştirici</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#08090d; color:#dfe6f0; font-family:'Segoe UI',monospace; overflow:hidden; height:100vh; }
  #ui { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; }
  #topbar { display:flex; align-items:center; gap:14px; padding:10px 18px; border-bottom:1px solid #161a24; }
  #topbar h1 { font-size:15px; letter-spacing:1px; background:linear-gradient(90deg,#7fd4ff,#ff9d5c); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .chip { background:#10131c; border:1px solid #1d2434; padding:3px 10px; border-radius:20px; font-size:11px; color:#8fa3c0; }
  .chip b { color:#7fd4ff; }
  #stage { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:8px 18px; border-top:1px solid #161a24; }
  .stat { background:#0e1119; border:1px solid #1a2130; border-radius:8px; padding:6px 12px; }
  .stat .lbl { font-size:9px; color:#5f6f8c; text-transform:uppercase; letter-spacing:1px; }
  .stat .val { font-size:16px; font-weight:700; margin-top:2px; }
  #vramv { color:#5dd48c; } #ramv { color:#ff9d5c; } #tokv { color:#7fd4ff; } #confv { color:#b78cff; }
  #inputrow { display:flex; gap:8px; padding:10px 18px 12px; }
  #inp { flex:1; background:#0e1119; border:1px solid #1d2434; color:#dfe6f0; padding:9px 14px; border-radius:8px; font-size:14px; outline:none; }
  #inp:focus { border-color:#7fd4ff; }
  #btn { background:linear-gradient(135deg,#2e6fae,#5b3d9e); border:none; color:#fff; padding:9px 22px; border-radius:8px; font-weight:700; cursor:pointer; }
  #btn:disabled { opacity:.4; cursor:wait; }
  #note { font-size:9px; color:#3d4a63; text-align:center; padding-bottom:6px; }
  #state { font-size:11px; color:#5dd48c; margin-left:auto; }
</style>
</head>
<body>
<div id="ui">
  <div id="topbar">
    <h1>🧠 DORINA — NÖRAL İZLEME</h1>
    <div class="chip">Katman: <b id="nlayers">-</b></div>
    <div class="chip">Nöron/katman: <b>24</b></div>
    <div id="state">BAĞLANIYOR...</div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="stats">
    <div class="stat"><div class="lbl">VRAM (GPU)</div><div class="val" id="vramv">-- MB</div></div>
    <div class="stat"><div class="lbl">RAM (Sistem)</div><div class="val" id="ramv">-- MB</div></div>
    <div class="stat"><div class="lbl">Üretilen Token</div><div class="val" id="tokv">0</div></div>
    <div class="stat"><div class="lbl">Top-1 Güven</div><div class="val" id="confv">-</div></div>
  </div>
  <div id="inputrow">
    <input id="inp" placeholder="Örnek: Yapay zeka nedir, kısaca anlat?" autocomplete="off" />
    <button id="btn">▶ BAŞLAT</button>
  </div>
  <div id="note">Gerçek model hesapları: 28 katman × 24 nöron (hidden state segment aktivasyonu), attention ışınları, tokenizer çıktısı, VRAM/RAM. Sahte veri yok.</div>
</div>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let N = 28, ws = null, running = false;
let layerActs = [], attnVals = [], inputToks = [], outputToks = [];
let smooth = []; // yumuşak geçiş için

function resize(){ cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
resize(); addEventListener('resize', resize);

const colors = (v) => {
  // koyu lacivert -> mavi -> turkuaz -> parlak turuncu
  const h = 220 - v * 160;
  const l = 15 + v * 55;
  return `hsl(${h}, 90%, ${l}%)`;
};

function draw() {
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);

  // arka plan grid
  ctx.fillStyle = '#08090d';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(30,38,55,0.25)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  if (!layerActs.length) {
    ctx.fillStyle = '#3d4a63';
    ctx.font = '13px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Bir soru yaz ve BAŞLAT — modelin beyni burada canlanacak', W/2, H/2);
    requestAnimationFrame(draw);
    return;
  }

  const padX = 70;
  const nCols = N;
  const colW = (W - padX * 2) / nCols;
  const nRows = layerActs[0].length;
  const topPad = 18, bottomPad = 26;
  const rowH = (H - topPad - bottomPad) / nRows;

  // attention ışınları: son token -> girdi token'ları
  if (attnVals.length > 1) {
    const srcX = W - 20;
    const nIn = inputToks.length;
    for (let i = 0; i < nIn; i++) {
      const a = attnVals[i] || 0;
      if (a < 0.15) continue;
      const dstY = topPad + (i / Math.max(1, nIn - 1)) * (H - topPad - bottomPad);
      const grad = ctx.createLinearGradient(srcX, 0, 40, 0);
      grad.addColorStop(0, `hsla(40,100%,70%,${a * 0.8})`);
      grad.addColorStop(1, 'rgba(127,212,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1 + a * 2.5;
      ctx.beginPath(); ctx.moveTo(srcX, H/2); ctx.quadraticCurveTo(W*0.55, H/2, 40, dstY); ctx.stroke();
    }
  }

  // katmanlar: bağlantılar (önce, altta kalsın)
  for (let c = 0; c < nCols - 1; c++) {
    const x1 = padX + c * colW + colW/2;
    const x2 = padX + (c+1) * colW + colW/2;
    for (let r = 0; r < nRows; r += 3) {
      const a1 = layerActs[c]?.[r] || 0;
      const a2 = layerActs[c+1]?.[r] || 0;
      const a = (a1 + a2) / 2;
      if (a < 0.25) continue;
      const y1 = topPad + r * rowH + rowH/2;
      const y2 = topPad + r * rowH + rowH/2;
      ctx.strokeStyle = `hsla(210, 85%, 60%, ${a * 0.35})`;
      ctx.lineWidth = 0.6 + a;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }

  // katman sütunları + nöronlar
  for (let c = 0; c < nCols; c++) {
    const x = padX + c * colW + colW/2;
    for (let r = 0; r < nRows; r++) {
      const v = layerActs[c]?.[r] || 0;
      const y = topPad + r * rowH + rowH/2;
      const rad = Math.max(1.2, Math.min(5, colW * 0.16 * (0.5 + v)));
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, 7);
      ctx.fillStyle = colors(v);
      ctx.fill();
      if (v > 0.75) {
        ctx.strokeStyle = `hsla(${220 - v*160},100%,75%,0.8)`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    // katman etiketi
    if (c % 4 === 0) {
      ctx.fillStyle = '#3d4a63';
      ctx.font = '8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('L' + c, x, H - 8);
    }
  }

  // girdi token'ları (sol)
  if (inputToks.length) {
    ctx.fillStyle = '#ffd479';
    ctx.font = '9px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('GİRDİ', 56, 12);
    ctx.font = '8px monospace';
    const nIn = inputToks.length;
    for (let i = 0; i < Math.min(nIn, 40); i++) {
      const y = topPad + (i / Math.max(1, nIn - 1)) * (H - topPad - bottomPad);
      ctx.fillStyle = 'rgba(255,212,121,0.85)';
      ctx.fillText((inputToks[i] || '').substring(0, 12).replace(/\n/g,'⏎'), 56, y + 3);
    }
    ctx.fillStyle = '#5f6f8c';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('→ embedding →', padX - 8, H/2);
  }

  // üretilen token'lar (sağ)
  if (outputToks.length) {
    ctx.fillStyle = '#ff9d5c';
    ctx.font = '9px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('CEVAP', W - 40, 12);
    ctx.font = '8px monospace';
    const nOut = outputToks.length;
    for (let i = 0; i < Math.min(nOut, 40); i++) {
      const y = topPad + (i / Math.max(1, nOut - 1)) * (H - topPad - bottomPad);
      ctx.fillStyle = 'rgba(255,157,92,0.9)';
      ctx.fillText((outputToks[i] || '').substring(0, 12).replace(/\n/g,'⏎'), W - 52, y + 3);
    }
  }

  requestAnimationFrame(draw);
}
draw();

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $('state').textContent = 'HAZIR'; $('state').style.color = '#5dd48c'; };
  ws.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'input') {
      inputToks = d.tokens; outputToks = []; layerActs = []; attnVals = [];
      N = 28;
      $('nlayers').textContent = N;
      $('state').textContent = 'İŞLİYOR';
    } else if (d.type === 'token') {
      N = d.layers.length;
      layerActs = d.layers;
      if (d.attn) attnVals = d.attn;
      outputToks.push(d.token);
      $('tokv').textContent = d.step;
      $('vramv').textContent = d.vram + ' MB';
      $('ramv').textContent = d.ram + ' MB';
      $('confv').textContent = d.top && d.top.length ? (Math.round(d.top[0][1]*100) + '%') : '-';
      $('state').textContent = 'ÜRETİYOR...';
    } else if (d.type === 'error') {
      $('state').textContent = 'HATA: ' + d.msg.substring(0, 60);
      $('state').style.color = '#ff6b6b';
      $('btn').disabled = false;
    } else if (d.type === 'done') {
      $('state').textContent = 'BİTTİ ✓';
      $('state').style.color = '#b78cff';
      $('btn').disabled = false;
    }
  };
  ws.onclose = () => { setTimeout(connect, 2000); };
}

$('btn').onclick = () => {
  const msg = $('inp').value.trim();
  if (!msg || !ws || ws.readyState !== 1) return;
  $('btn').disabled = true;
  layerActs = []; attnVals = []; outputToks = [];
  ws.send(JSON.stringify({message: msg}));
};
$('inp').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });
connect();
</script>
</body>
</html>
